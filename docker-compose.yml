version: '3.8'

services:
  mysql-db:
    image: mysql:9.7.2
    container_name: mysql-db
    ports:
      - "8899:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456   # 改成你的密码
      MYSQL_DATABASE: agent_db
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql_data:/var/lib/mysql

  # 👇 把 Qdrant 也加进编排
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage